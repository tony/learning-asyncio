[project]
name = "learning-asyncio"
version = "0.1.0"
description = ""
license = { text = "All Rights Reserved" }
readme = "README.md"
requires-python = ">=3.14,<4.0"
authors = [
  {name = "Tony Narlock", email = "tony@git-pull.com"}
]

[dependency-groups]
dev = [
  ### Testing ###
  "pytest",
  "pytest-rerunfailures",
  "pytest-watcher",
    # Lint
  "ruff>=0.16.1",
  "mypy",
  "typing-extensions",
]

[tool.mypy]
strict = true
python_version = "3.14"
files = [
  "src/",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# `select` is deliberately unset: ruff 0.16 enables a curated default rule
# set, and an explicit `select` would replace it rather than extend it.
# `extend-select` layers this project's additional linters on top.
extend-select = [
  "E", # pycodestyle
  "F", # pyflakes
  "I", # isort
  "UP", # pyupgrade
  "A", # flake8-builtins
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "COM", # flake8-commas
  "EM", # flake8-errmsg
  "Q", # flake8-quotes
  "PTH", # flake8-use-pathlib
  "SIM", # flake8-simplify
  "TRY", # Trycertatops
  "PERF", # Perflint
  "RUF", # Ruff-specific rules
  "D", # pydocstyle
]
ignore = [
  "COM812", # missing trailing comma, ruff format conflict
]

[tool.ruff.lint.isort]
known-first-party = [
  "src",
  "doctest_document",
  "docutils_compat",
  "gp_libs",
  "linkify_issues",
  "pytest_doctest_docutils",
]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"*.py" = [
  "T201"  # print() statements are used for doctest and normal outputs
]
# `blocking_worker` calls `time.sleep()` from an `async def` on purpose: the
# lesson counts the heartbeat ticks the event loop misses while it blocks.
"src/006_blocking_calls.py" = ["ASYNC251"]
# `_fallback_staggered_race` must treat any candidate failure as "start the
# next one", the contract `asyncio.staggered.staggered_race` implements by
# capturing `BaseException` per candidate. The factories are caller-supplied,
# so there is no narrower type to catch.
"src/020_advanced_scheduling_and_executors.py" = ["BLE001"]

[tool.pytest]
minversion = "9.0"
strict = true
faulthandler_exit_on_timeout = true
addopts = [
  "--tb=short",
  "--no-header",
  "--showlocals",
  "--doctest-modules",
]
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
testpaths = ["src"]

[tool.pytest-watcher]
now = true
ignore_patterns = ["*.py.*.py"]
